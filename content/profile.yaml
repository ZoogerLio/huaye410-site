profile:
  name: "Ye Hua"
  role: "Ph.D. Candidate in History"
  affiliation: "The Hong Kong Institute for the Humanities and Social Sciences, The University of Hong Kong"
  location: "Hong Kong"
  email: "yehua@connect.hku.hk"
  introduction: "I study landscape-based geomantic knowledge and technology in late imperial China, with particular interests in religion, environment, material culture, and knowledge production."
  biography:
    - "Ye Hua is a PhD candidate at the Hong Kong Institute for the Humanities and Social Sciences, University of Hong Kong, where she holds the HKU Presidential PhD Scholarship. She was also a Predoctoral Scholar at the Max Planck Institute for the History of Science (2025–2026). Before beginning her doctoral studies in September 2022, she received her BA and MA in Chinese history from Fudan University."
    - "Her dissertation examines the historical development of landscape-based (xingfa 形法) geomancy in southern China from the twelfth to the eighteenth century. This branch of Chinese geomantic knowledge draws on the configurations of mountains and waterways to interpret the movement of qi 氣 and its influence on human fortunes."
    - "Drawing on historical texts and fengshui manuscripts gathered through archival and field research, her dissertation investigates how historical actors developed, transmitted, and applied geomantic knowledge through their engagement with mountainous landscapes. It explores how people learned to interpret and modify landscape configurations to influence human fortunes, and how they applied this knowledge to develop technologies for maintaining social order and regulating everyday life. In particular, her research examines how geomantic practices connected local environments, individuals, communities, and imperial rule."
  profileImage: "/images/profile.jpg"
  heroImage: "/images/hero-background.jpg"
  footerImage: "/images/footer-background.jpg"
  interests:
    - title: "Geomantic Knowledge and Technology"
      description: "Tracing the production, circulation, visualization, and practical use of fengshui knowledge from the twelfth to the eighteenth century."
    - title: "Religion and Environmental History"
      description: "Examining how religious practice and ideas about landscapes shaped relations among communities, mountains, rivers, and ancestors."
    - title: "History of Science and Material Culture"
      description: "Investigating how technical expertise, diagrams, objects, and everyday reference works produced and transmitted knowledge."
    - title: "Digital Humanities"
      description: "Using spatial and digital methods, including GIS, to support historical research on landscapes and communities."
